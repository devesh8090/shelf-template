name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python-version }} --group dev pytest -q
      - name: smoke test the installed command
        shell: bash
        run: |
          uv run --python ${{ matrix.python-version }} shelf init "$RUNNER_TEMP/lib"
          cd "$RUNNER_TEMP/lib"
          uv run --project "$GITHUB_WORKSPACE" --python ${{ matrix.python-version }} shelf doctor
          uv run --project "$GITHUB_WORKSPACE" --python ${{ matrix.python-version }} shelf lint
